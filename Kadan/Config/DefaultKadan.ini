[CoreRedirects]
+PackageRedirects=(OldName="/Script/P4MapKitAuthoring",NewName="/Script/Kadan")

; The game content Play builds a new level from. The scenes link their worlds, demo lists and placement
; counts; the base is the first asset of the arrival world's placement list that places every base class.
[PreviewTemplate]
WorldScene=/Game/Carrot4/GameScene/Game/Area/SD_Area001
GeometryStream=/Game/Carrot4/Maps/Main/Area/Area001/Sublevels/Area001_GameArea
PlayerStream=/Game/Carrot4/Maps/Main/Area/Area001/Sublevels/Area001_Player
ArrivalScene=/Game/Carrot4/GameScene/Game/Area/SD_Area002
+BaseClass=/Game/Carrot4/Placeables/Pod/GPod.GPod_C
+BaseClass=/Game/Carrot4/Placeables/Objects/Camp/GPodCampSimple.GPodCampSimple_C

; What a game class does when it is constructed, which the editor's stand-in of the class does not, read from the
; game's code. The water box (AWaterBox::OnConstruction, its render target setup at 0x00D17970) gives its caustics
; decal a dynamic instance of its CausticsMaterial and sets the instance's water plane height to its surface's world
; height. Kadan applies these to a map's actors on transient instances (P4NativeConstructionPreview.cpp).
[NativeConstruction]
+DecalMaterial=(Class="/Script/Carrot4.WaterBox", Decal="CausticsDecal", Material="CausticsMaterial", HeightParameter="WaterPlane Height", HeightComponent="WaterSurface")
