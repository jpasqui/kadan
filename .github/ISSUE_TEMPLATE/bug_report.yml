name: Bug report
description: Report a problem in Kadan, its build tools, or its documentation.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Give the Kadan version or commit and Unreal version. For a game result, include the game build and Tsuchi version.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Host checks or build tools
        - Unreal Editor
        - Game in an emulator
        - Game on a console
        - Documentation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include relevant logs, tool versions, and screenshots. Remove private paths and personal information. Don't attach game files, saves, keys, or Unreal Engine files.
