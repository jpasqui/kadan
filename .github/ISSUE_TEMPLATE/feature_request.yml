name: Feature request
description: Propose a change to Kadan.
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: Describe what you want to do and what prevents it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want and any alternatives you've tried.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Include a creator workflow or exported mod that would use the feature.
